name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skeleton
        run: bash scripts/validate-skeleton.sh

      - name: Lint OpenAPI
        if: ${{ hashFiles('openapi/openapi.json') != '' }}
        run: npx --yes @redocly/cli@latest lint openapi/openapi.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # TODO: add stack-specific jobs once the application stack is chosen:
  # install, lint, type-check, test, build, dependency scan, and docker
  # build when the project uses containers. See ci-cd-standards.md in the
  # chromadb tooling repository (docs/standards/).
