services:
  api:
    environment:
      SECURITY_PREFLIGHT_AKB_RAG_BASE_URL: ${SECURITY_PREFLIGHT_AKB_RAG_BASE_URL:-http://rag-retrieval-service:8080/api/v1}
    networks:
      default: {}
      akb_app: {}

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

networks:
  akb_app:
    external: true
    name: ${SECURITY_PREFLIGHT_AKB_DOCKER_NETWORK:-akl_app_zone}
