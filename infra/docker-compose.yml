name: security-preflight

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8781}
        NEXT_PUBLIC_SECURITY_PREFLIGHT_BASE_PATH: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_BASE_PATH:-}
        NEXT_PUBLIC_SECURITY_PREFLIGHT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_PUBLIC_BASE_URL:-}
        NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_ISSUER: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_ISSUER:-}
        NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_CLIENT_ID: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_CLIENT_ID:-}
        NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_SCOPES: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_SCOPES:-openid profile email}
        NEXT_PUBLIC_STRATOS_HOME_URL: ${NEXT_PUBLIC_STRATOS_HOME_URL:-https://stratos.zeleznalady.cz/}
        NEXT_PUBLIC_PROJECTFLOW_URL: ${NEXT_PUBLIC_PROJECTFLOW_URL:-https://stratos.zeleznalady.cz/project}
        NEXT_PUBLIC_AKB_URL: ${NEXT_PUBLIC_AKB_URL:-https://stratos.zeleznalady.cz/akb}
        NEXT_PUBLIC_ARCHFLOW_URL: ${NEXT_PUBLIC_ARCHFLOW_URL:-}
        NEXT_PUBLIC_PROCESSFORGE_URL: ${NEXT_PUBLIC_PROCESSFORGE_URL:-}
      secrets:
        - npmrc
    environment:
      APP_ENV: ${APP_ENV:-development}
      WEB_PORT: "8780"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8781}
      NEXT_PUBLIC_SECURITY_PREFLIGHT_BASE_PATH: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_BASE_PATH:-}
      NEXT_PUBLIC_SECURITY_PREFLIGHT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_PUBLIC_BASE_URL:-}
      NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_ISSUER: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_ISSUER:-}
      NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_CLIENT_ID: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_CLIENT_ID:-}
      NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_SCOPES: ${NEXT_PUBLIC_SECURITY_PREFLIGHT_OIDC_SCOPES:-openid profile email}
      NEXT_PUBLIC_STRATOS_HOME_URL: ${NEXT_PUBLIC_STRATOS_HOME_URL:-https://stratos.zeleznalady.cz/}
      NEXT_PUBLIC_PROJECTFLOW_URL: ${NEXT_PUBLIC_PROJECTFLOW_URL:-https://stratos.zeleznalady.cz/project}
      NEXT_PUBLIC_AKB_URL: ${NEXT_PUBLIC_AKB_URL:-https://stratos.zeleznalady.cz/akb}
      NEXT_PUBLIC_ARCHFLOW_URL: ${NEXT_PUBLIC_ARCHFLOW_URL:-}
      NEXT_PUBLIC_PROCESSFORGE_URL: ${NEXT_PUBLIC_PROCESSFORGE_URL:-}
    ports:
      - "8780:8780"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8781"
      DATABASE_URL: postgresql://security_preflight:security_preflight@postgres:5432/security_preflight
      REDIS_URL: redis://redis:6379/0
      REPORTS_PATH: /reports
      PROJECTS_ROOT_CONTAINER: ${PROJECTS_ROOT_CONTAINER:-/workspace/projects}
      SECURITY_PREFLIGHT_AUTH_MODE: ${SECURITY_PREFLIGHT_AUTH_MODE:-}
      SECURITY_PREFLIGHT_API_TOKEN: ${SECURITY_PREFLIGHT_API_TOKEN:-}
      SECURITY_PREFLIGHT_CORS_ORIGINS: ${SECURITY_PREFLIGHT_CORS_ORIGINS:-http://localhost:8780,http://127.0.0.1:8780}
      SECURITY_PREFLIGHT_OIDC_ISSUER: ${SECURITY_PREFLIGHT_OIDC_ISSUER:-}
      SECURITY_PREFLIGHT_OIDC_JWKS_URL: ${SECURITY_PREFLIGHT_OIDC_JWKS_URL:-}
      SECURITY_PREFLIGHT_OIDC_CLIENT_ID: ${SECURITY_PREFLIGHT_OIDC_CLIENT_ID:-}
      SECURITY_PREFLIGHT_OIDC_AUDIENCE: ${SECURITY_PREFLIGHT_OIDC_AUDIENCE:-}
      SECURITY_PREFLIGHT_REQUIRED_ROLES: ${SECURITY_PREFLIGHT_REQUIRED_ROLES:-security-preflight.viewer,security-preflight.operator,security-preflight.admin,stratos_security_admin,stratos_superadmin,superadmin}
      SECURITY_PREFLIGHT_OPERATOR_ROLES: ${SECURITY_PREFLIGHT_OPERATOR_ROLES:-security-preflight.operator,security-preflight.admin,stratos_security_admin,stratos_superadmin,superadmin}
      SECURITY_PREFLIGHT_AKB_RAG_BASE_URL: ${SECURITY_PREFLIGHT_AKB_RAG_BASE_URL:-}
      SECURITY_PREFLIGHT_AKB_PUBLIC_BASE_URL: ${SECURITY_PREFLIGHT_AKB_PUBLIC_BASE_URL:-https://stratos.zeleznalady.cz/akb}
      SECURITY_PREFLIGHT_AKB_SERVICE_TOKEN: ${SECURITY_PREFLIGHT_AKB_SERVICE_TOKEN:-}
      SECURITY_PREFLIGHT_AKB_OIDC_TOKEN_URL: ${SECURITY_PREFLIGHT_AKB_OIDC_TOKEN_URL:-}
      SECURITY_PREFLIGHT_AKB_OIDC_CLIENT_ID: ${SECURITY_PREFLIGHT_AKB_OIDC_CLIENT_ID:-}
      SECURITY_PREFLIGHT_AKB_OIDC_CLIENT_SECRET: ${SECURITY_PREFLIGHT_AKB_OIDC_CLIENT_SECRET:-}
      SECURITY_PREFLIGHT_AKB_OIDC_AUDIENCE: ${SECURITY_PREFLIGHT_AKB_OIDC_AUDIENCE:-akl-api}
      SECURITY_PREFLIGHT_AKB_OIDC_SCOPE: ${SECURITY_PREFLIGHT_AKB_OIDC_SCOPE:-openid profile email}
      SECURITY_PREFLIGHT_AKB_SYNC_REQUIRED: ${SECURITY_PREFLIGHT_AKB_SYNC_REQUIRED:-false}
      SECURITY_PREFLIGHT_TENANT_ID: ${SECURITY_PREFLIGHT_TENANT_ID:-default}
      SCANNER_NETWORK_MODE: none
      ALLOW_DOCKER_SOCKET: "false"
      ALLOW_ACTIVE_DAST: "false"
      DAST_ALLOWED_HOSTS: localhost,127.0.0.1,host.docker.internal
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_URL: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_URL:-}
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_HEALTH_URL: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_HEALTH_URL:-}
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_TOKEN_REF: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_TOKEN_REF:-}
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_PUBLIC_KEY: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_PUBLIC_KEY:-}
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_REQUIRE_SIGNATURE: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_REQUIRE_SIGNATURE:-true}
      SECURITY_PREFLIGHT_DEFECTDOJO_URL: ${SECURITY_PREFLIGHT_DEFECTDOJO_URL:-}
      SECURITY_PREFLIGHT_DEFECTDOJO_TOKEN_REF: ${SECURITY_PREFLIGHT_DEFECTDOJO_TOKEN_REF:-}
      SECURITY_PREFLIGHT_DEFECTDOJO_PRODUCT: ${SECURITY_PREFLIGHT_DEFECTDOJO_PRODUCT:-}
      SECURITY_PREFLIGHT_DEFECTDOJO_EXPORT_ENABLED: ${SECURITY_PREFLIGHT_DEFECTDOJO_EXPORT_ENABLED:-false}
      SECURITY_PREFLIGHT_DEFECTDOJO_EXPORT_REQUIRED: ${SECURITY_PREFLIGHT_DEFECTDOJO_EXPORT_REQUIRED:-false}
      SECURITY_PREFLIGHT_DEFECTDOJO_REIMPORT: ${SECURITY_PREFLIGHT_DEFECTDOJO_REIMPORT:-false}
      SECURITY_PREFLIGHT_DEFECTDOJO_PRODUCT_TYPE: ${SECURITY_PREFLIGHT_DEFECTDOJO_PRODUCT_TYPE:-STRATOS}
      SECURITY_PREFLIGHT_DEFECTDOJO_ENGAGEMENT: ${SECURITY_PREFLIGHT_DEFECTDOJO_ENGAGEMENT:-}
      SECURITY_PREFLIGHT_DEFECTDOJO_AUTO_CREATE_CONTEXT: ${SECURITY_PREFLIGHT_DEFECTDOJO_AUTO_CREATE_CONTEXT:-true}
      SECURITY_PREFLIGHT_GREENBONE_URL: ${SECURITY_PREFLIGHT_GREENBONE_URL:-}
      SECURITY_PREFLIGHT_GREENBONE_CREDENTIAL_REF: ${SECURITY_PREFLIGHT_GREENBONE_CREDENTIAL_REF:-}
      SECURITY_PREFLIGHT_GREENBONE_REPORT_PATH: ${SECURITY_PREFLIGHT_GREENBONE_REPORT_PATH:-}
      SECURITY_PREFLIGHT_OPENSCAP_CONTENT_PATH: ${SECURITY_PREFLIGHT_OPENSCAP_CONTENT_PATH:-}
      SECURITY_PREFLIGHT_OPENSCAP_RESULTS_PATH: ${SECURITY_PREFLIGHT_OPENSCAP_RESULTS_PATH:-}
      SECURITY_PREFLIGHT_OPENSCAP_PROFILE: ${SECURITY_PREFLIGHT_OPENSCAP_PROFILE:-}
      SECURITY_PREFLIGHT_OPENSCAP_EVAL_ENABLED: ${SECURITY_PREFLIGHT_OPENSCAP_EVAL_ENABLED:-false}
      SECURITY_PREFLIGHT_RESULT_SINK_ENABLED: ${SECURITY_PREFLIGHT_RESULT_SINK_ENABLED:-false}
      SECURITY_PREFLIGHT_RESULT_SINK_URL: ${SECURITY_PREFLIGHT_RESULT_SINK_URL:-}
      SECURITY_PREFLIGHT_RESULT_SINK_TOKEN_REF: ${SECURITY_PREFLIGHT_RESULT_SINK_TOKEN_REF:-}
      SECURITY_PREFLIGHT_RESULT_SINK_REQUIRED: ${SECURITY_PREFLIGHT_RESULT_SINK_REQUIRED:-false}
    ports:
      - "8781:8781"
    volumes:
      - security_preflight_reports:/reports
      - ${PROJECTS_ROOT_HOST:-${PWD}}:${PROJECTS_ROOT_CONTAINER:-/workspace/projects}:ro
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://security_preflight:security_preflight@postgres:5432/security_preflight
      REDIS_URL: redis://redis:6379/0
      REPORTS_PATH: /reports
      PROJECTS_ROOT_HOST: ${PROJECTS_ROOT_HOST:-${PWD}}
      PROJECTS_ROOT_CONTAINER: ${PROJECTS_ROOT_CONTAINER:-/workspace/projects}
      SCANNER_NETWORK_MODE: none
      SCANNER_RUNNER_ENABLED: "true"
      SCANNER_RUNNER_MODE: ${SCANNER_RUNNER_MODE:-direct}
      SCANNER_TOOLBOX_IMAGE: ${SCANNER_TOOLBOX_IMAGE:-security-preflight/scanner-toolbox:local}
      ALLOW_DOCKER_SOCKET: "false"
      ALLOW_ACTIVE_DAST: "false"
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_URL: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_URL:-}
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_HEALTH_URL: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_HEALTH_URL:-}
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_TOKEN_REF: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_TOKEN_REF:-}
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_PUBLIC_KEY: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_PUBLIC_KEY:-}
      SECURITY_PREFLIGHT_EXTERNAL_SCANNER_REQUIRE_SIGNATURE: ${SECURITY_PREFLIGHT_EXTERNAL_SCANNER_REQUIRE_SIGNATURE:-true}
      SECURITY_PREFLIGHT_DEFECTDOJO_URL: ${SECURITY_PREFLIGHT_DEFECTDOJO_URL:-}
      SECURITY_PREFLIGHT_DEFECTDOJO_TOKEN_REF: ${SECURITY_PREFLIGHT_DEFECTDOJO_TOKEN_REF:-}
      SECURITY_PREFLIGHT_DEFECTDOJO_PRODUCT: ${SECURITY_PREFLIGHT_DEFECTDOJO_PRODUCT:-}
      SECURITY_PREFLIGHT_DEFECTDOJO_EXPORT_ENABLED: ${SECURITY_PREFLIGHT_DEFECTDOJO_EXPORT_ENABLED:-false}
      SECURITY_PREFLIGHT_DEFECTDOJO_EXPORT_REQUIRED: ${SECURITY_PREFLIGHT_DEFECTDOJO_EXPORT_REQUIRED:-false}
      SECURITY_PREFLIGHT_DEFECTDOJO_REIMPORT: ${SECURITY_PREFLIGHT_DEFECTDOJO_REIMPORT:-false}
      SECURITY_PREFLIGHT_DEFECTDOJO_PRODUCT_TYPE: ${SECURITY_PREFLIGHT_DEFECTDOJO_PRODUCT_TYPE:-STRATOS}
      SECURITY_PREFLIGHT_DEFECTDOJO_ENGAGEMENT: ${SECURITY_PREFLIGHT_DEFECTDOJO_ENGAGEMENT:-}
      SECURITY_PREFLIGHT_DEFECTDOJO_AUTO_CREATE_CONTEXT: ${SECURITY_PREFLIGHT_DEFECTDOJO_AUTO_CREATE_CONTEXT:-true}
      SECURITY_PREFLIGHT_GREENBONE_URL: ${SECURITY_PREFLIGHT_GREENBONE_URL:-}
      SECURITY_PREFLIGHT_GREENBONE_CREDENTIAL_REF: ${SECURITY_PREFLIGHT_GREENBONE_CREDENTIAL_REF:-}
      SECURITY_PREFLIGHT_GREENBONE_REPORT_PATH: ${SECURITY_PREFLIGHT_GREENBONE_REPORT_PATH:-}
      SECURITY_PREFLIGHT_OPENSCAP_CONTENT_PATH: ${SECURITY_PREFLIGHT_OPENSCAP_CONTENT_PATH:-}
      SECURITY_PREFLIGHT_OPENSCAP_RESULTS_PATH: ${SECURITY_PREFLIGHT_OPENSCAP_RESULTS_PATH:-}
      SECURITY_PREFLIGHT_OPENSCAP_PROFILE: ${SECURITY_PREFLIGHT_OPENSCAP_PROFILE:-}
      SECURITY_PREFLIGHT_OPENSCAP_EVAL_ENABLED: ${SECURITY_PREFLIGHT_OPENSCAP_EVAL_ENABLED:-false}
      SECURITY_PREFLIGHT_RESULT_SINK_ENABLED: ${SECURITY_PREFLIGHT_RESULT_SINK_ENABLED:-false}
      SECURITY_PREFLIGHT_RESULT_SINK_URL: ${SECURITY_PREFLIGHT_RESULT_SINK_URL:-}
      SECURITY_PREFLIGHT_RESULT_SINK_TOKEN_REF: ${SECURITY_PREFLIGHT_RESULT_SINK_TOKEN_REF:-}
      SECURITY_PREFLIGHT_RESULT_SINK_REQUIRED: ${SECURITY_PREFLIGHT_RESULT_SINK_REQUIRED:-false}
    volumes:
      - security_preflight_reports:/reports
      - ${PROJECTS_ROOT_HOST:-${PWD}}:${PROJECTS_ROOT_CONTAINER:-/workspace/projects}:ro
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_preflight
      POSTGRES_USER: security_preflight
      POSTGRES_PASSWORD: security_preflight
    ports:
      - "8782:5432"
    volumes:
      - security_preflight_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "8783:6379"
    volumes:
      - security_preflight_cache:/data

  scanner-toolbox:
    image: security-preflight/scanner-toolbox:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.scanner-toolbox
    command: ["sleep", "infinity"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    network_mode: none
    volumes:
      - ${PROJECTS_ROOT_HOST:-${PWD}}:${PROJECTS_ROOT_CONTAINER:-/workspace/projects}:ro

volumes:
  security_preflight_postgres:
  security_preflight_reports:
  security_preflight_cache:

networks:
  default:
    name: ${SECURITY_PREFLIGHT_DOCKER_NETWORK_NAME:-security-preflight_default}
    ipam:
      driver: default
      config:
        - subnet: ${SECURITY_PREFLIGHT_DOCKER_SUBNET:-10.246.250.0/24}
          gateway: ${SECURITY_PREFLIGHT_DOCKER_GATEWAY:-10.246.250.1}

secrets:
  npmrc:
    file: ${HOME}/.npmrc
